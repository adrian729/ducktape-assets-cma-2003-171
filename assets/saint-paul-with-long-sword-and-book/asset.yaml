title: Saint Paul with sword and book
description: A standing bearded man with receding brown hair and a blue halo dotted in white, in a long cream mantle over a blue robe, holds a tall sword upright against his shoulder in one hand and a closed book in the other; his head turns to the left and the mantle falls in deep folds to his feet. Black contours and flat colours with pale shading; the background is transparent.
