title: Kneeling saint seized by the hair, left scene
description: A haloed man in a blue mantle over a red robe kneels at the left with hands joined in prayer, facing right, while a bareheaded man in a short cream tunic, orange-red hose and black shoes strides toward him from the right, grips the top of his head with one hand and holds a pale object at his hip with the other, looking back over his shoulder. Black contours, gold halo, flat colours; the background is transparent.
