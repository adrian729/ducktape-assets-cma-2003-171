title: Kneeling saint seized by the hair, right scene
description: A bearded, haloed man in an orange-red robe kneels at the left with hands joined in prayer, facing right, while a curly-haired man in a blue tunic with red sleeves and buttons, red hose and black shoes stands over him, bends to grip his hair with one hand and raises the other arm high holding a small pale object. Black contours, gold halo, flat colours; the background is transparent.
