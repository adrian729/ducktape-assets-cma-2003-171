title: Saint Peter with a large key
description: A standing bearded man with curly gray hair and a cream halo, in a blue mantle lined in gray over an orange-red robe, holds a large cream key over his shoulder in one hand and raises the other hand open; his head turns to the right and the mantle hangs in long folds edged with white dots. Black contours and flat colours with pale shading; the background is transparent.
